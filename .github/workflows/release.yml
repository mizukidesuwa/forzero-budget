name: Build & Publish Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check version & tag match
        id: meta
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)" | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version v$VERSION" >&2
            exit 1
          fi
      - run: npm ci
      - name: Fetch the official Windows runtime and matching license
        shell: pwsh
        run: |
          $nodeVersion = node -p process.version
          $distribution = "node-$nodeVersion-win-x64"
          $archive = Join-Path $env:RUNNER_TEMP "$distribution.zip"
          $download = "https://nodejs.org/dist/$nodeVersion"
          Invoke-WebRequest "$download/$distribution.zip" -OutFile $archive
          $checksums = (Invoke-WebRequest "$download/SHASUMS256.txt").Content
          $expected = ($checksums -split '\r?\n' | Where-Object { $_.EndsWith("  $distribution.zip") }) -split '\s+' | Select-Object -First 1
          if (!$expected -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw "Node.js distribution checksum mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          "FORZERO_NODE_EXE=$(Join-Path $env:RUNNER_TEMP "$distribution/node.exe")" >> $env:GITHUB_ENV
      - run: npm run build:release -- --bundle-node
      - run: npm run verify:fast -- --skip-build
      - run: npm run release:stage -- --skip-build
      - name: Smoke-test the staged Windows portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $archive = "dist-v2/release/v$env:VERSION/forzero-budget-windows-x64-$env:VERSION.zip"
          $installation = Join-Path $env:RUNNER_TEMP "forzero-budget-windows-x64-$env:VERSION"
          Expand-Archive -LiteralPath $archive -DestinationPath $installation
          node scripts/verify-desktop-start.mjs --portable $installation
      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          STAGE_DIR="dist-v2/release/v$VERSION"
          TAG="v$VERSION"
          FILES=(
            "$STAGE_DIR/forzero-budget-windows-x64-$VERSION.zip"
            "$STAGE_DIR/forzero-budget-$VERSION.zip"
            "$STAGE_DIR/forzero-budget-mobile-$VERSION.html"
            "$STAGE_DIR/SHA256SUMS.txt"
            "$STAGE_DIR/MANIFEST.json"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "FORZERO: BUDGET $TAG" --notes-file "$STAGE_DIR/RELEASE-NOTES.md"
          else
            gh release create "$TAG" "${FILES[@]}" --title "FORZERO: BUDGET $TAG" --notes-file "$STAGE_DIR/RELEASE-NOTES.md"
          fi
