name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download latest desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$RUNNER_TEMP/latest-release.json"
          curl --fail --silent --show-error \
            --oauth2-bearer "$GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" \
            -o "$release_json"
          download_url="$(jq -er \
            '[.assets[] | select(.name | test("^forzero-budget-[0-9][0-9A-Za-z.+-]*\\.zip$"))] |
             if length == 1 then .[0].browser_download_url else error("expected exactly one desktop ZIP") end' \
            "$release_json")"
          archive="$RUNNER_TEMP/desktop-release.zip"
          curl --fail --silent --show-error --location "$download_url" -o "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP/desktop-release"
          mkdir -p pages-dist
          cp "$RUNNER_TEMP/desktop-release/index.html" \
            "$RUNNER_TEMP/desktop-release/style.css" \
            "$RUNNER_TEMP/desktop-release/game.js" \
            pages-dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
