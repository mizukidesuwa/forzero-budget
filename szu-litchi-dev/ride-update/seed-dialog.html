    <dialog id="seedDialog" class="settings-dialog" aria-labelledby="seedTitle">
      <form id="seedForm">
        <h2 id="seedTitle">种子赛道</h2>
        <div class="setting-line"><label for="weeklyCode">本周挑战 <small>本机时间 · 周一更新</small></label>
          <input id="weeklyCode" readonly aria-label="本周公开种子码"></div>
        <div class="settings-actions seed-actions">
          <button class="action primary" type="button" id="weeklyPlay">参加本周挑战</button>
          <button class="action" type="button" id="weeklyCopy">复制本周种子</button>
          <button class="action" type="button" id="weeklyBoard" aria-haspopup="dialog">本周友人对战</button>
        </div>
        <div class="setting-line">
          <label for="seedInput">种子码 <small id="seedCampus"></small></label>
          <input id="seedInput" type="text" maxlength="15" autocomplete="off" spellcheck="false" autocapitalize="characters" aria-describedby="seedStatus">
        </div>
        <p class="bike-note" id="seedStatus" role="status">同一张地图输入同一种子码，得到同一条赛道。</p>
        <div class="settings-actions seed-actions">
          <button class="action primary" id="seedApply" type="submit">生成并选中</button>
          <button class="action" id="seedRandom" type="button">随机一条</button>
          <button class="action" id="seedClose" type="button">返回</button>
        </div>
      </form>
    </dialog>
