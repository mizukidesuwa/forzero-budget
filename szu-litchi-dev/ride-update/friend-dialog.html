    <dialog id="friendDialog" class="settings-dialog" aria-labelledby="friendTitle">
      <header class="settings-head friend-head">
        <h2 id="friendTitle">友人对战</h2>
        <button class="action" id="friendClose" type="button">返回</button>
      </header>
      <fieldset class="friend-filters" id="friendFilters" aria-label="筛选成绩">
        <label>地图<select id="friendCampus"></select></label>
        <label>赛道<select id="friendCourse"></select></label>
        <label>车型<select id="friendVehicle"></select></label>
      </fieldset>
      <p id="friendBoardNote" class="friend-board-note" role="status"></p>
      <div class="friend-multi-bar" id="friendMultiBar" hidden><span id="friendMultiCount"></span><button class="action primary" id="friendMultiPlay" type="button">多影子群跑</button></div>
      <div class="friend-scores" id="friendScores" aria-label="友人成绩" role="region"></div>
      <template id="friendScoreTemplate">
        <li><div class="friend-score">
          <input class="friend-pick" type="checkbox" aria-label="加入多影子群跑">
          <span class="friend-score-name"></span>
          <span class="friend-score-time"></span>
          <button class="action friend-play" type="button">对战</button>
          <button class="action friend-remove" type="button">移除</button>
        </div></li>
      </template>
      <input type="file" id="friendFile" accept=".json,application/json" hidden>
      <button class="friend-drop" id="friendDrop" type="button" aria-describedby="friendStatus">
        <strong>导入影子文件</strong>
        <span>拖入文件，或点击选择</span>
      </button>
      <p id="friendStatus" class="bike-note" role="status">影子保存在当前浏览器。完赛后可导出自己的影子。</p>
    </dialog>
