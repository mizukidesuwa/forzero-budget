    <dialog id="onlineDialog" class="settings-dialog" aria-labelledby="onlineHeading">
      <header class="settings-head friend-head">
        <h2 id="onlineHeading">联机骑行</h2>
        <button class="action" id="onlineClose" type="button">返回</button>
      </header>
      <div id="onlineSetup">
        <div class="online-create">
          <label for="onlineFormat">赛制</label>
          <select id="onlineFormat">
            <option value="bo1">BO1 · 一局定胜负</option>
            <option value="bo3">BO3 · 最多三局</option>
            <option value="league">积分联赛 · 五轮</option>
            <option value="random">盲盒随机 · 三轮随机种子</option>
            <option value="triathlon">铁人三项 · 三轮全载具</option>
          </select>
          <button class="action primary" id="onlineCreate" type="button">创建房间</button>
        </div>
        <div class="online-rules-row">
          <label>车型
            <select id="onlineVehicleRule">
              <option value="bike">统一自行车</option>
              <option value="trail">统一越野小摩托</option>
              <option value="ebike">统一电动自行车</option>
              <option value="chair">统一电动轮椅</option>
              <option value="any">自由混选</option>
            </select>
          </label>
          <label>天气
            <select id="onlineWeather">
              <option value="day">正午晴天</option>
              <option value="sunset">黄昏日落</option>
              <option value="night">夜骑灯光</option>
              <option value="rain">小雨湿地</option>
            </select>
          </label>
        </div>
        <div class="online-rules-row">
          <label>改车时间（秒）
            <input id="onlineTuningTime" type="number" min="0" max="180" step="5" value="30">
          </label>
          <label>配车规则<select id="onlineBudget"><option value="open">不限预算</option><option value="400">¥400 地贫赛</option><option value="700">¥700 紧凑赛</option><option value="party">允许违禁整活件</option></select></label>
          <label>盲盒预算<select id="onlineBlind"><option value="off">关闭</option><option value="on">每轮随机预算</option></select></label>
          <label>风场模式<select id="onlineWindMode"><option value="gust">阵风</option><option value="steady">恒定</option></select></label>
          <label>车流密度<select id="onlineTraffic">
            <option value="off">关闭</option><option value="sparse" selected>稀疏</option><option value="standard">标准</option>
          </select></label>
          <label>车辆碰撞箱
            <select id="onlineCollision">
              <option value="off">关闭（默认）</option>
              <option value="on">开启</option>
            </select>
          </label>
        </div>
        <div class="online-rules-row">
          <label>地图风速（m/s）
            <input id="onlineWindSpeed" type="number" min="0" max="15" step="0.5" value="0">
          </label>
          <label>地图风向
            <select id="onlineWindDir">
              <option value="0">偏西风</option><option value="1">西北风</option>
              <option value="2">偏北风</option><option value="3">东北风</option>
              <option value="4">偏东风</option><option value="5">东南风</option>
              <option value="6">偏南风</option><option value="7">西南风</option>
            </select>
          </label>
        </div>
        <div class="online-host">
          <label for="onlineHostInput">房主地址</label>
          <input id="onlineHostInput" placeholder="加入时填房主 IP（如 26.1.2.3）" autocomplete="off" spellcheck="false">
        </div>
        <form class="online-join" id="onlineJoinForm">
          <label for="onlineCodeInput">房间码</label>
          <input id="onlineCodeInput" maxlength="8" placeholder="8 位房间码" autocomplete="off" spellcheck="false" autocapitalize="characters">
          <button class="action" id="onlineJoin" type="submit">加入房间</button>
        </form>
      </div>
      <section id="onlineLobby" hidden>
        <div class="online-room-head"><h3 id="onlineTitle"></h3><output id="onlineCode" aria-label="房间码"></output></div>
        <p id="onlineBike" class="bike-note"></p>
        <p id="onlineHostHint" class="bike-note online-host-hint" hidden></p>
        <div class="online-host-controls" id="onlineHostControls" hidden>
          <label>地图<select id="onlineLobbyCampus"><option value="szu">深大粤海</option><option value="ucl">伦敦 Bloomsbury</option><option value="shunde">顺峰山公园</option></select></label>
          <label>赛道<select id="onlineLobbyCourse"></select></label>
          <button class="action" id="onlineLobbySeed" type="button">摇新种子</button>
          <label>车型<select id="onlineLobbyVehicle">
            <option value="bike">统一自行车</option><option value="trail">统一越野小摩托</option>
            <option value="ebike">统一电动自行车</option><option value="chair">统一电动轮椅</option>
            <option value="any">自由混选</option>
          </select></label>
          <label>天气<select id="onlineLobbyWeather">
            <option value="day">正午晴天</option><option value="sunset">黄昏日落</option>
            <option value="night">夜骑灯光</option><option value="rain">小雨湿地</option>
          </select></label>
          <label>改车时间（秒）<input id="onlineLobbyTuning" type="number" min="0" max="180" step="5" value="30"></label>
          <label>配车规则<select id="onlineLobbyBudget"><option value="open">不限预算</option><option value="400">¥400 地贫赛</option><option value="700">¥700 紧凑赛</option><option value="party">允许违禁整活件</option></select></label>
          <label>盲盒预算<select id="onlineLobbyBlind"><option value="off">关闭</option><option value="on">每轮随机预算</option></select></label>
          <label>风场模式<select id="onlineLobbyWindMode"><option value="gust">阵风</option><option value="steady">恒定</option></select></label>
          <label>车流密度<select id="onlineLobbyTraffic">
            <option value="off">关闭</option><option value="sparse">稀疏</option><option value="standard">标准</option>
          </select></label>
          <label>车辆碰撞箱<select id="onlineLobbyCollision">
            <option value="off">关闭</option><option value="on">开启</option>
          </select></label>
          <label>风速（m/s）<input id="onlineLobbyWindSpeed" type="number" min="0" max="15" step="0.5" value="0"></label>
          <label>风向<select id="onlineLobbyWindDir">
            <option value="0">偏西风</option><option value="1">西北风</option>
            <option value="2">偏北风</option><option value="3">东北风</option>
            <option value="4">偏东风</option><option value="5">东南风</option>
            <option value="6">偏南风</option><option value="7">西南风</option>
          </select></label>
        </div>
        <div class="online-tuning-banner" id="onlineTuningBanner" hidden></div>
        <ul class="online-list" id="onlinePlayers" aria-label="房内骑手"></ul>
        <ol class="online-list online-standing" id="onlineStanding" aria-label="总排名" hidden></ol>
        <ol class="online-list" id="onlineRounds" aria-label="各轮成绩" hidden></ol>
        <div class="settings-actions online-actions">
          <button class="action primary" id="onlineReady" type="button">准备</button>
          <button class="action primary" id="onlineStart" type="button">发车</button>
          <button class="action" id="onlineGarage" type="button">车库改装</button>
          <button class="action" id="onlineInvite" type="button">复制邀请</button>
          <button class="action exit" id="onlineLeave" type="button">退出房间</button>
        </div>
      </section>
      <p class="bike-note" id="onlineStatus" role="status"></p>
    </dialog>
