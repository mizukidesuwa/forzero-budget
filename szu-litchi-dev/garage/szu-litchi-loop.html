function programBasins() {
  for (const basin of basins) {
    const center=water.vertex([basin.x,basin.y,basin.z],UP,rgb('#619f8b'),0,0);
    for (let i=0;i<=144;i++) {
      const a=TAU*i/144,b=TAU*(i+1)/144;
      const p=water.vertex(bank(basin,a),UP,rgb('#619f8b'),Math.cos(a),Math.sin(a));
      if (i) water.indices.push(center,p,p-1);
      if (i===144) break;
      pavement.quad(bank(basin,a,.12,.032),bank(basin,b,.12,.032),bank(basin,b,-.64,.053),bank(basin,a,-.64,.053),'#a29f7d');
      const outerA=bank(basin,a,-2.15,.019),outerB=bank(basin,b,-2.15,.019);
      if (nearestStreet(outerA[0],outerA[2]).distance>4.7)
        pavement.quad(bank(basin,a,-1.09,.020),bank(basin,b,-1.09,.020),outerB,outerA,'#c3b59b');
    }
    if (basin.rx<20) continue;
    for (let i=0;i<32;i++) {
      const p=bank(basin,range(0,TAU),range(-.42,.08),.036);
      for (let j=0;j<7;j++) {
        const root=add(p,[range(-.19,.19),0,range(-.19,.19)]);
        scenery.tube(root,add(root,[range(-.23,.23),range(.21,.56),range(-.2,.22)]),.013,.006,choose(['#68864e','#82914c','#9b995d']),4,false);
      }
    }
  }
}

function localGreens() {
  // Keep planted beds tight to the walks so the campus grounds stay distinct from the city blocks.
  const plant = (x,z,s,kind) => {
    if (!inCampus(x,z) || lakeClearance(x,z)<.7 || buildingAt(x,z,1.6)
      || treeSites.some(t=>Math.hypot(t.x-x,t.z-z)<3.9)) return;
    const near=nearestStreet(x,z);
    if (near.street && near.distance<near.street.width+1.7) return;
    if (Math.hypot(sportsCenter[0]-x,sportsCenter[1]-z)<23 || !landmarkClearance(x,z)) return;
    deciduous(x,z,s,kind);
  };
  for (const path of roads.slice(0,8)) {
    for (let d=10;d<path.length-9;d+=17.5) {
      const p=courseFrame(path,d);
      for (const side of [-1,1]) {
        const t=offsetVertex(p,side*(path.width+range(1.9,4.5)),0);
        if (random()<.86) plant(t[0],t[2],range(.95,1.54),Math.round(range(0,2)));
      }
      const t=offsetVertex(p,path.width+.82,0);
      if (inCampus(t[0],t[2]) && !buildingAt(t[0],t[2],.8) && lakeClearance(t[0],t[2])>1
        && nearestStreet(t[0],t[2],path).distance>5.8) lamppost(t[0],t[2],scale(p.side,-1));
    }
  }
  for (let i=0;i<190;i++) {
    const x=range(-173,170),z=range(-209,219);
    if (random()<.64 && x>-78 && x<115) continue;
    plant(x,z,range(.78,1.70),i%3);
  }
  for (const basin of basins.slice(0,2)) {
    for (let i=0;i<17;i++) {
      const p=bank(basin,TAU*i/17,-3.05,0);
      if (i%5===0 && inCampus(p[0],p[2]) && nearestStreet(p[0],p[2]).distance>6.1 && !buildingAt(p[0],p[2],1)) palm(p[0],p[2],1.22);
      else if (i%3!==0) plant(p[0],p[2],range(.91,1.36),i%3);
      if (i%4===1 && nearestStreet(p[0],p[2]).distance>5.75 && !buildingAt(p[0],p[2])) {
        bench(p[0],p[2],TAU*i/17+Math.PI/2);
      }
    }
  }
}

function namedSign(title, subtitle, background, ink) {
  return signCanvas(1050,205,(ctx,w,h)=>{
    ctx.fillStyle=background;ctx.fillRect(0,0,w,h);
    ctx.textAlign='center';ctx.fillStyle=ink;
    ctx.font='700 104px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText(title,w*.5,113);
    if (subtitle) {
      ctx.font='600 34px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.fillText(subtitle,w*.5,165);
    }
  });
}

function lotBox(block,u,y,v,w,h,d,color,mesh=masonry) {
  mesh.box(lotPoint(block,u,y,v),[w,h,d],color,block.yaw);
}

function facadeOf(block,quarter=0,inset=0) {
  const yaw=block.yaw+quarter*Math.PI/2, c=Math.cos(yaw), s=Math.sin(yaw);
  const width=quarter%2?block.depth:block.w;
  const depth=quarter%2?block.w:block.depth;
  const point=(u,y,v=0)=>[block.x+c*u+s*(depth/2+v-inset),y,block.z-s*u+c*(depth/2+v-inset)];
  const panel=(u,y,w,h,color,v=.022)=>masonry.quad(
    point(u-w/2,y-h/2,v),point(u+w/2,y-h/2,v),
    point(u+w/2,y+h/2,v),point(u-w/2,y+h/2,v),color,[s,0,c]);
  return {panel,point,width,yaw,normal:[s,0,c]};
}

function facadeName({point,yaw},title,subtitle,y,w,h,skin='#d9d8ce',ink='#394847') {
  plate(namedSign(title,subtitle,skin,ink),point(0,y,.051),w,h,yaw);
}

function glazing(face,y,bays,color='#45646a',h=1.02) {
  const w=face.width-.65;
  face.panel(0,y,w,h,color);
  for(let i=1;i<bays;i++) face.panel(w*(i/bays-.5),y,.061,h,'#b7c2bd',.035);
}

  lotBox(block,0,.43,0,w+.16,.86,depth+.18,'#b0a69a');
  lotBox(block,0,h/2+.66,0,w,h,depth,brick);
  lotBox(block,0,h+.75,0,w+.42,.34,depth+.42,white);
  lotBox(block,0,h+1.03,0,w-.24,.22,depth-.26,'#b9b8ab');
  lotBox(block,wing%2?w*.29:-w*.29,h+1.42,-depth*.27,2.75,1.01,3.38,white);
  for(let side=0;side<4;side++) {
    const face=facadeOf(block,side);
    const bays=Math.max(3,Math.round(face.width/(side%2?2.05:2.36)));
    for(let floor=0;floor<floors;floor++) {
      const y=2.72+floor*2.32;
      face.panel(0,y-.79,face.width,.18,white);
      for(let col=0;col<bays;col++) {
        const bay=(face.width-.82)/bays, u=(col-(bays-1)/2)*bay;
        face.panel(u,y,bay-.26,1.53,white);
        face.panel(u,y+.075,bay-.51,1.17,(col+floor+wing)%3?'#557174':'#6f8584',.035);
        face.panel(u,y+.085,.069,1.19,'#c4cfc6',.043);
        face.panel(u,y-.64,bay-.18,.103,'#ede8d9',.047);

      facadeName(face,`汇文楼 H${wing}`,'',1.93,3.42,.49,white,'#624c45');

  }
}

function huixingBuilding(block) {
  const {w,depth}=block;
  const aluminum='#b1b4ab', ledge='#d9dacf', dark='#587077';
  lotBox(block,0,.35,0,w,.70,depth,'#a8aba1');
  lotBox(block,0,3.0,0,w-.12,5.31,depth-.18,'#758282');
  lotBox(block,0,5.79,0,w+.38,.34,depth+.38,ledge);
  for(let i=0;i<4;i++) {
    const face=facadeOf(block,i,.06);
    for(let level=0;level<4;level++) {
      glazing(face,1.31+level*1.07,Math.ceil(face.width/2.3),dark,.79);
      face.panel(0,1.81+level*1.07,face.width,.20,ledge,.049);
    }
    for(let band=0;band<3;band++) face.panel(0,4.10+band*.62,face.width,.095,'#c6cac2',.066);
  }
  // Two side wings and the lintel leave the upper opening continuous front to back.
  const tower=lotPart(block,1.45,-.38,w*.70,depth*.77,22.6);
  const gap=7.56, sideW=(tower.w-gap)/2, lower=13.15, lintel=20.35;
  const towerBase=5.86;
  lotBox(tower,0,(towerBase+lower)/2,0,tower.w,lower-towerBase,tower.depth,aluminum);
  lotBox(tower,0,(lintel+22.76)/2,0,tower.w,22.76-lintel,tower.depth,aluminum);
  for(const sign of [-1,1]) {
    lotBox(tower,sign*(gap+sideW)/2,(lower+lintel)/2,0,sideW,lintel-lower,tower.depth,aluminum);
    lotBox(tower,sign*(gap/2+.085),(lower+lintel)/2,0,.17,lintel-lower,tower.depth-.05,'#bec3bc');
  }
  lotBox(tower,0,22.79,0,tower.w+.27,.25,tower.depth+.32,ledge);
  lotBox(tower,-tower.w*.28,23.30,-tower.depth*.27,5.5,.98,3.38,'#a5ada7');
  for(let side=0;side<4;side++) {
    const face=facadeOf(tower,side);
    for(let floor=0;floor<9;floor++) {
      const y=6.88+floor*1.73;
      if(side%2===1 || y<lower-.4 || y>lintel+.4) {
        glazing(face,y,Math.ceil(face.width/2.10),floor%2?'#5c767c':'#617b83',.83);
        face.panel(0,y+.49,face.width,.11,'#c6c9bf',.041);
      } else for(const s of [-1,1]) {
        const u=s*(gap+sideW)/2;
        face.panel(u,y,sideW-.34,.86,dark);
        for(let j=-1;j<=1;j++) face.panel(u+j*sideW*.23,y,.075,.85,'#aebbb7',.034);
      }
    }
    if(side%2===0) for(const sign of [-1,1]) face.panel(sign*gap/2,(lower+lintel)/2,.18,lintel-lower,'#d9dad1',.043);
  }
  const face=facadeOf(block);
  face.panel(0,1.39,9.45,2.6,'#3c585b',.075);
  for(let i=0;i<4;i++)
    lotBox(block,0,.089*(i+1),10.65-i*.44,11.6,.178*(i+1),.45,'#c0c4b8');
  lotBox(block,0,.011,12.6,12.5,.039,3.07,'#c1c1af',pavement);

}

function huidianBuilding(block) {
  const stone='#e3decf', cap='#ede8db', shade='#b5b0a2';
  const {w,depth}=block;
  lotBox(block,0,1.13,0,w,2.26,depth,shade);
  lotBox(block,0,8.63,0,w,13.14,depth,stone);
  lotBox(block,0,15.20,0,w+.56,.28,depth+.56,cap);
  lotBox(block,-2.2,15.68,-1.7,w*.56,.74,depth*.56,'#b6b7ac');
  lotBox(block,0,1.05,8.30,15.8,2.10,1.70,shade);
  lotBox(block,0,2.11,8.26,17.20,.16,1.86,cap);
  for(const side of [-1,1]) {
    for(let n=0;n<9;n++) {
      const h=(n+1)*.237;
      lotBox(block,side*9.25,h/2,9.45-n*.268,2.64,h,.283,n%2?'#c9c4b6':'#d5cfc1');
    }
    for(const edge of [-1,1]) {
      const u=side*9.25+edge*1.23;
      scenery.tube(lotPoint(block,u,1.02,9.59),lotPoint(block,u,3.05,7.18),.027,.027,'#a8b1ab',5);
      for(let i=0;i<4;i++) lotBox(block,u,1.02+i*.62,9.40-i*.70,.054,.98,.054,'#919d96');
    }
  }
  for(let side=0;side<4;side++) {
    const face=facadeOf(block,side);
    const bays=Math.ceil(face.width/1.66);
    for(let floor=0;floor<5;floor++) {
      const y=4.45+floor*2.17;
      if(side===0 && floor<2) {
        for(const u of [-8.5,8.5]) face.panel(u,y,5.5,1.23,'#718383');
      } else glazing(face,y,bays,floor%2?'#6f898a':'#526e75',1.19);
      face.panel(0,y+1.01,face.width,.13,cap,.040);
    }
    if(side%2) face.panel(face.width*.32,1.13,face.width*.29,1.89,'#647670');

function glassPassage(start,end,y,w=2.40) {
  const dx=end[0]-start[0], dz=end[2]-start[2], span=Math.hypot(dx,dz);
  const lot=campusFootprint((start[0]+end[0])/2,(start[2]+end[2])/2,span,w,-Math.atan2(dz,dx));
  lotBox(lot,0,y-.13,0,span,.26,w,'#b5bab2');
  lotBox(lot,0,y+1.29,0,span,2.50,w-.14,'#63858c');
  lotBox(lot,0,y+2.58,0,span+.13,.23,w+.24,'#dcdfd5');
  for(const side of [-1,1]) {
    for(let i=0;i<=Math.ceil(span/1.25);i++)
      lotBox(lot,-span/2+i*span/Math.ceil(span/1.25),y+1.28,side*(w-.09)/2,.077,2.52,.074,'#cdd8d1');
    lotBox(lot,0,y+1.12,side*(w-.061)/2,span,.077,.075,'#b4c7c3');
  }
}

function huiwenWalkways() {
  for(const [a,b,y] of [[0,1,4.62],[1,2,4.91],[3,4,4.68]]) {
    const first=huiwenWings[a], second=huiwenWings[b];
    const axis=normalize([second.x-first.x,0,second.z-first.z]);
    const terrace=(block,sign)=>{
      const distance=Math.min((block.w/2-.27)/Math.abs(axis[0]*block.c-axis[2]*block.s),
        (block.depth/2-.27)/Math.abs(axis[0]*block.s+axis[2]*block.c));
      return add([block.x,0,block.z],scale(axis,sign*distance));
    };
    glassPassage(terrace(first,1),terrace(second,-1),y,2.22);
  }
}

function yuanpingGym(block) {

    const a=w*1.04*(i/ribs-.5), b=w*1.04*((i+1)/ribs-.5), z=depth*.52;
    const p=roof(a,-z), q=roof(a,z), r=roof(b,z), s=roof(b,-z);
    masonry.quad(p,q,r,s,i%3?bronze:'#a9a986',normalize(cross(subtract(q,p),subtract(r,p))));
    masonry.tube(p,q,.046,.046,'#c0be9c',4,false);

      masonry.quad(lotPoint(block,a,6.1,v),lotPoint(block,b,6.1,v),roof(b,v),roof(a,v),wall,

function renderCampusLandmark(block) {
  switch(block.kind) {
    case 'huiwen': huiwenBuilding(block); break;
    case 'huizi': huiziBuilding(block); break;
    case 'huixing': huixingBuilding(block); break;
    case 'huidian': huidianBuilding(block); break;
    case 'huizhi': huizhiBuilding(block); break;
    case 'yuanping': yuanpingGym(block); break;
    case 'zhiyi': zhiyiBuilding(block); break;
    case 'academic': {
      const h=block.floors*2.28+1;
      lotBox(block,0,h/2,0,block.w,h,block.depth,'#d7d1bb');
      lotBox(block,0,h+.10,0,block.w+.34,.23,block.depth+.36,'#b4bbad');
      for(let side=0;side<4;side++) {
        const face=facadeOf(block,side);
        for(let i=0;i<block.floors;i++) glazing(face,1.64+2.28*i,Math.floor(face.width/1.68));
      }
      facadeName(facadeOf(block),block.name,block.use,2.66,Math.min(block.w*.58,8.7),.73);
      break;
    }
    default: return false;
  }
  return true;
}

function entranceFrame({xy,facing}) {
  const frame=campusFootprint(xy[0],xy[1],0,0,Math.atan2(facing[0],facing[2]));
  const p=(u,y,v)=>lotPoint(frame,u,y,v);
  const box=(u,y,v,w,h,d,color,mesh=scenery)=>lotBox(frame,u,y,v,w,h,d,color,mesh);
  const solid=(u,v,w,d,h,padding=0)=>campusFixtures.push(lotPart(frame,u,v,w+padding,d+padding,h));
  return {frame,p,box,solid,yaw:frame.yaw};
}

function tiledGatehouse(frame,u,v,mirror) {
  const {p,box,solid}=frame, wide=3.0, deep=2.43, sections=28;
  const tile=['#e3e1d7','#deded6','#eeebe2','#dedbd2'];
  const edge=(a,y,r=1)=>p(u+wide*r*Math.cos(a),y,v+deep*r*Math.sin(a));
  const at=(a,y)=>edge(a,y,y<2.2?1:1.04);
  for(let i=0;i<sections;i++) {
    const a=i*TAU/sections, b=(i+1)*TAU/sections, mid=(a+b)/2;
    const n=[frame.frame.c*Math.cos(mid)+frame.frame.s*Math.sin(mid),0,
      -frame.frame.s*Math.cos(mid)+frame.frame.c*Math.sin(mid)];
    scenery.quad(at(a,.15),at(b,.15),at(b,.68),at(a,.68),'#b7b8ac',n);
    const window=Math.cos(mid)*mirror < .10 || Math.sin(mid) < -.74;
    for(let row=0;row<4;row++) {
      const low=.69+row*.355, high=low+.341;
      scenery.quad(at(a,low),at(b,low),at(b,high),at(a,high),window?'#536b70':tile[(i+row)%4],n);
    }
    if (window && i%2===0) scenery.tube(at(a,.68),at(a,2.10),.024,.024,'#a4aea9',4,false);
    scenery.quad(edge(a,2.11,1.08),edge(b,2.11,1.08),edge(b,2.63,1.055),edge(a,2.63,1.055),tile[i%4],n);
    scenery.triangle(p(u,2.63,v),edge(a,2.63,1.055),edge(b,2.63,1.055),'#c9c9be');
    scenery.quad(edge(a,2.63,1.054),edge(b,2.63,1.054),edge(b,2.76,1.072),edge(a,2.76,1.072),'#f0eee3',n);
    scenery.triangle(p(u,2.76,v),edge(a,2.76,1.072),edge(b,2.76,1.072),'#d9dacd');
  }
  box(u+mirror*2.98,1.35,v-.69,3.17,2.70,3.32,'#dedfd6');
  box(u+mirror*2.97,2.72,v-.76,3.43,.18,3.47,'#efeee3');
  solid(u,v,5.42,3.98,2.76);
  solid(u+mirror*3.02,v-.69,3.15,3.32,2.80);
}

function foldedRoof({p},profile,front,back) {
  for(let i=1;i<profile.length;i++) {
    const [a,ha]=profile[i-1], [b,hb]=profile[i];
    const low=.23, slope=.45;
    const af=p(a,ha,front), bf=p(b,hb,front), ar=p(a,ha+slope,back), br=p(b,hb+slope,back);
    const under=vertex=>add(vertex,[0,-low,0]);
    const n=normalize(cross(subtract(bf,af),subtract(ar,af)));
    scenery.quad(af,bf,br,ar,i%2?'#c9d4d3':'#a4b5b6',n);
    scenery.quad(under(bf),under(af),under(ar),under(br),'#728587',scale(n,-1));
    scenery.quad(af,bf,under(bf),under(af),'#8a9c9c',normalize(cross(subtract(bf,af),[0,1,0])));
    scenery.quad(br,ar,under(ar),under(br),'#90a2a1',normalize(cross(subtract(ar,br),[0,1,0])));
  }
}

function schoolGate(gate) {

function ovalPoint(lot,angle,width,length,y) {
  const round=width*.5;
  const u=Math.cos(angle)*round;
  const v=Math.sin(angle)*round+Math.sign(Math.sin(angle))*(length-width)*.5;
  return lotPoint(lot,u,y,v);
}

function stadiumBand(mesh,lot,width,length,band,y,color) {
  const edge=(angle,inset)=>ovalPoint(lot,angle,width-inset*2,length-inset*2,y);
  // Include both straight sides so all the lanes share clean joins at the bends.
  const angles=Array.from({length:66},(_,i)=>(i<33?0:-Math.PI)+.00001+(Math.PI-.00002)*(i%33)/32);
  for(let i=0;i<angles.length;i++) {
    const a=angles[i], b=angles[(i+1)%angles.length];
    mesh.quad(edge(a,0),edge(b,0),edge(b,band),edge(a,band),color);
  }
}

  for(let i=0;i<=4;i++) stadiumBand(masonry,lot,w-.12-i*1.40,d-.12-i*1.40,.034,.041,'#f0dcbd');
  const pitchW=w-10.5,pitchD=d-13.5;
  for(const s of [-1,1]) {

    lotBox(lot,0,.042,s*(pitchD/2-2.05),pitchW*.42,.015,.069,'#dbe1bc');
    for(let step=0;step<4;step++)
      lotBox(lot,s*(w/2+.69-step*.38),.26+step*.24,0,.39,.49+step*.48,d*.71,step%2?'#a8b5a8':'#d2d3bf',scenery);
    campusFixtures.push(lotPart(lot,s*(w/2+.04),0,1.64,d*.71,1.72));

  lotBox(lot,0,.042,0,pitchW,.015,.062,'#dbe1bc');

}

function landmarkClearance(x,z) {
  return !closeToBlock(x,z,athleticsField,1.9) && !campusFixtures.some(f=>closeToBlock(x,z,f,1.15)) &&
    !treeSetbacks.some(lot=>closeToBlock(x,z,lot)) &&
    !campusGates.some(g=>Math.hypot(x-g.xy[0],z-g.xy[1])<9.7);
}

function boundaryEdges() {
  const entrances=[...campusGates,...canghaiGates], links=[...cityLinks,...canghaiStreets];
  for(const outline of campusOutlines) for(let i=0;i<outline.length;i++) {
    const a=outline[i],b=outline[(i+1)%outline.length];
    const d=Math.hypot(b[0]-a[0],b[1]-a[1]), yaw=-Math.atan2(b[1]-a[1],b[0]-a[0]);
    for(let m=0;m<d;m+=3.1) {
      const q=Math.min(d,m+3.06), c=(m+q)/2/d;
      const x=mix(a[0],b[0],c), z=mix(a[1],b[1],c);
      const crossesPublicRoad=[m,(m+q)/2,q].some(along=>{
        const t=along/d, px=mix(a[0],b[0],t), pz=mix(a[1],b[1],t);
        return nearestCitySegment(px,pz,null,.58)||cityStreetAt(px,pz);
      });
      if(crossesPublicRoad || entrances.some(g=>Math.hypot(g.xy[0]-x,g.xy[1]-z)<9.6) ||
         links.some(({path})=>path.rows.some(({p})=>Math.hypot(p[0]-x,p[2]-z)<path.width+1))) continue;
      scenery.box([x,.33,z],[q-m,.66,.47],'#b4ac95',yaw);
      scenery.box([x,.68,z],[q-m,.10,.58],'#c8c0a9',yaw);
      if (Math.floor(m/3.1)%2===0) scenery.box([x,.91,z],[.10,.46,.13],'#62796c');
      scenery.box([x,1.12,z],[q-m,.05,.2],'#5f746b',yaw);
    }
  }
}

const flyover = (() => {
  const path=openStreets[1].path, crossing=pointDistance(path,[-132,-240]);
  const from=crossing-104, to=crossing+104;
  const first=along(path,from), last=along(path,to);
  return {path,crossing,from,to,first,last,half:3.68,top:6.82};
})();

function flyoverHeight(distance) {
  const ramp=clamp((104-Math.abs(distance-flyover.crossing))/74,0,1);
  return CITY_ASPHALT+(flyover.top-CITY_ASPHALT)*ramp*ramp*(3-2*ramp);
}

function flyoverAt(x,z) {
  const {first,last,half,from,to,path}=flyover;
  if(x<first[0]-1||x>last[0]+1||z<Math.min(first[2],last[2])-13||z>Math.max(first[2],last[2])+13) return null;
  let nearest=half*half, distance=null;
  const rows=path.rows;
  const candidates=cityRoadIndex?.get(streetCell(x,z))??[];
  for(const segment of candidates) {
    if(segment.path!==path) continue;
    const dx=x-segment.x,dz=z-segment.z;
    const fraction=clamp((dx*segment.dx+dz*segment.dz)*segment.ratio,0,1);
    const gap=(dx-segment.dx*fraction)**2+(dz-segment.dz*fraction)**2;
    if(gap>=nearest) continue;
    const d=mix(rows[segment.row-1].distance,rows[segment.row].distance,fraction);
    if(d<from||d>to) continue;
    nearest=gap;
    distance=d;
  }
  return distance===null?null:flyoverHeight(distance);
}

function drawFlyover() {
  const {path,half,from,to,crossing}=flyover, shoulder=half+.31;
  const surface=(frame,d,offset,rise=0)=>offsetVertex(frame,offset,flyoverHeight(d)+rise);
  const count=Math.ceil((to-from)/2.4);
  for(let i=0;i<count;i++) {
    const a=mix(from,to,i/count), b=mix(from,to,(i+1)/count);
    const fa=courseFrame(path,a), fb=courseFrame(path,b);
    const y1=flyoverHeight(a),y2=flyoverHeight(b);
    const rail=d=>.35*clamp((flyoverHeight(d)-.08)/1.8,0,1);
    const p=(u,h=0)=>surface(fa,a,u,h), q=(u,h=0)=>surface(fb,b,u,h);
    urban.quad(p(-half,.002),q(-half,.002),q(half,.002),p(half,.002),'#5a6765');
    const under=Math.min(.56,Math.max(y1,y2)-CITY_ASPHALT);
    urban.quad(p(shoulder,-under),q(shoulder,-under),q(-shoulder,-under),p(-shoulder,-under),'#89958d',[0,-1,0]);
    for(const s of [-1,1]) {
      const edge=s*shoulder, inner=s*half;
      const n=scale(fa.side,s), h1=rail(a),h2=rail(b);
      urban.quad(p(inner,h1),q(inner,h2),q(edge,h2),p(edge,h1),'#c4c6b8');
      urban.quad(p(inner,0),q(inner,0),q(inner,h2),p(inner,h1),'#b0b6ac',scale(n,-1));
      urban.quad(p(edge,-Math.min(under,y1-CITY_ASPHALT)),q(edge,-Math.min(under,y2-CITY_ASPHALT)),
        q(edge,h2),p(edge,h1),'#aeb4a8',n);
      urban.quad(p(s*(half-.18)-.032,.012),q(s*(half-.18)-.032,.012),
        q(s*(half-.18)+.032,.012),p(s*(half-.18)+.032,.012),'#dfddc3');
    }
  }
  for(let d=from+1.6;d<to-2;d+=6.8) {
    const a=courseFrame(path,d), b=courseFrame(path,d+3.45);
    urban.quad(surface(a,d,-.058,.014),surface(b,d+3.45,-.058,.014),
      surface(b,d+3.45,.058,.014),surface(a,d,.058,.014),'#e1d0a0');
  }
  for(const offset of [-49,-29,32,53]) {
    const d=crossing+offset, [x,,z]=along(path,d), y=flyoverHeight(d);
    const pillar={x,z,w:2.10,d:2.18};
    citySolid.push(pillar);
    urban.box([x,(y-.52)/2,z],[pillar.w,y-.52,pillar.d],'#b6baaf');
    urban.box([x,y-.76,z],[3.55,.48,2.62],'#a5afa6');
    urban.box([x,.18,z],[2.43,.36,2.51],'#c2c4b5');
  }
}

function courseDecor(gpu,event,stage) {
  const paint=new Shape(),arches=new Shape(),decals=[];
  const from=stage?.from??0, to=Math.min(event.length,(stage?.to??event.length)+12);
  for(let d=Math.max(5.5,from);d<Math.min(event.length-3,to);d+=6.65) {
    const frame=courseFrame(event.path,d);
    const bend=plannedSpeed(event,d)<=9.02;
    for(const side of [-1,1]) {
      const p=offsetVertex(frame,side*.47,ROAD_Y+.0108);
      const tip=add(offsetVertex(frame,0,ROAD_Y+.0108),scale(frame.f,.65));
      paint.quad(add(p,scale(frame.f,-.02)),add(p,scale(frame.f,.135)),
        add(tip,scale(frame.f,.135)),tip,bend?'#f2b35e':stage?.color??'#dcec9f');
    }
  }
  for(const gate of event.gates) {
    if(gate.distance>=from && gate.distance<=to) trackBanner(gate,arches,decals,event.gates.length);
  }
  if (event.shortcut) {
    const path = event.shortcut.path;
    for (let d = .5; d < path.length - .4; d += 1.86) {
      ribbon(arches, path, -.12, .12, ROAD_Y + .023, '#f0d990', d, Math.min(d + 1.1, path.length));
    }
  }
  const marks = [...meshCells(gpu, [arches]), ...decals.map(({shape, canvas}) => new gpu.Mesh(shape, 5, canvas))];
  const placed = meshes => meshes.map(mesh => [mesh, IDENTITY]);
  return {
    arrows:placed(marks.concat(meshCells(gpu, [paint]))),
    braking:placed(marks.concat(meshCells(gpu, [brakingPaint(event,from,to)])))
  };
}



function pointDistance(path, xy) {
  let closest=path.rows[0], error=Infinity;
  for(const row of path.rows) {
    const squared=(row.p[0]-xy[0])**2+(row.p[2]-xy[1])**2;
    if(squared<error) {error=squared;closest=row;}
  }
  return closest.distance;
}

function section(path, a, b) {
  return {path,start:a?pointDistance(path,a):0,end:b?pointDistance(path,b):path.length};
}

function joinTrack(sections, starts) {
  const positions=[];
  const at = (part,t)=>along(part.path,mix(part.start,part.end,t));
  for(let i=0;i<sections.length;i++) {
    const part=sections[i];
    const span=Math.abs(part.end-part.start);
    const cut=Math.min(.19,4.2/Math.max(1,span));
    const from=i===0?0:cut,end=i+1===sections.length?1:1-cut;
    const count=Math.max(3,Math.ceil(span*(end-from)/.61));
    starts?.push(positions.length);
    for(let j=0;j<=count;j++) positions.push(at(part,mix(from,end,j/count)));
    if(i===sections.length-1) continue;
    const more=sections[i+1];
    const toCut=Math.min(.19,4.2/Math.max(1,Math.abs(more.end-more.start)));
    const inlet=at(part,end), joint=lerpPoint(at(part,1),at(more,0),.5), outlet=at(more,toCut);
    for(let j=1;j<=8;j++) {
      const f=j/9;
      positions.push(lerpPoint(lerpPoint(inlet,joint,f),lerpPoint(joint,outlet,f),f));
    }
  }
  return travelTable(positions);
}

function maxSafeSpeed(path,d) {
  const at=clamp(d,2.45,path.length-2.45);
  const before=courseFrame(path,at-2.4).f;
  const after=courseFrame(path,at+2.4).f;
  const curvature=Math.acos(clamp(dot(before,after),-1,1))/4.8;
  return clamp(Math.sqrt(7.9/Math.max(.001,curvature)),5.35,14.9);
}

function coursePlan(path,length) {
  const count=Math.ceil(length/2.35)+1;
  const spacing=length/(count-1);
  const raw=Array.from({length:count},(_,i)=>maxSafeSpeed(path,i*spacing));
  const speeds=raw.slice();
  for(let i=count-2;i>=0;i--) speeds[i]=Math.min(speeds[i],Math.sqrt(speeds[i+1]**2+2*4.65*spacing));
  return {spacing,speeds,raw};
}

function plannedSpeed(event,distance) {
  const a=event.plan;
  const i=clamp(distance/a.spacing,0,a.speeds.length-1);
  return mix(a.speeds[Math.floor(i)],a.speeds[Math.ceil(i)],i%1);
}

function publicGateSpan(frame) {
  const street=cityStreetAt(frame.p[0],frame.p[2]);
  if(!street) return null;
  const edge=direction=>{
    let inside=0;
    for(let d=.25;d<=42;d+=.25) {
      const [x,,z]=offsetVertex(frame,direction*d,0);
      if(!cityRoadContains(street,x,z,CITY_EDGE_MARGIN)) break;
      inside=d;
    }
    return direction*inside;
  };
  return {minCross:Math.min(-2.75,edge(-1)),maxCross:Math.max(2.75,edge(1))};
}

function timingSpan(frame,cityAccess,fallback,minimum=0) {
  const span=cityAccess?publicGateSpan(frame):null;
  if(span) return {...span,half:Math.max(-span.minCross,span.maxCross)};
  const hit=nearestStreet(frame.p[0],frame.p[2]);
  return {half:Math.max(minimum,(hit.street?.width??fallback)+.34)};
}

function notePublicMarkers(event) {
  for(const marker of event.markers) marker.publicRoads=roadInfoAt(marker.p[0],marker.p[2]);
}

function projectPublicCourse(event,position,direction,covered,gate) {
  const [x,,z]=position, active=roadInfoAt(x,z);
  if(!active.size) return null;
  const roads=[...active], {markers,markerStep}=event;
  const first=Math.max(0,Math.floor((covered-13)/markerStep));
  const last=Math.min(markers.length-1,Math.ceil(Math.min(gate.distance+8,covered+43)/markerStep));
  let best=Infinity, chosen=null;
  for(let i=first;i<last;i++) {
    const a=markers[i],b=markers[i+1];
    if(!roads.some(info=>a.publicRoads.has(info)||b.publicRoads.has(info))) continue;
    const dx=b.p[0]-a.p[0], dz=b.p[2]-a.p[2];
    const span=dx*dx+dz*dz;
    if(span<.01||direction[0]*dx+direction[2]*dz<-.32*Math.sqrt(span)) continue;
    const ux=x-a.p[0],uz=z-a.p[2];
    const t=(ux*dx+uz*dz)/span;
    if(t<-.32||t>1.32) continue;
    const fraction=clamp(t,0,1);
    const distance=mix(a.distance,b.distance,fraction);
    const gap=(ux-dx*fraction)**2+(uz-dz*fraction)**2;
    const score=gap+.015*(distance-covered)**2;
    if(score>=best) continue;
    best=score;
    chosen=distance;
  }
  return chosen===null?null:Math.min(gate.distance,chosen);
}

function makeCourse(id,name,description,path,spec,finish,options={}) {
  const labels=spec.map(([at,name],i)=> {
    const distance=options.absolute?at:at*finish;
    const frame=courseFrame(path,distance);
    const span=timingSpan(frame,options.cityAccess,path.width,2.75);
    return {...frame,...span,distance,name,index:i,number:i===0?'起点':i===spec.length-1?'终点':String(i).padStart(2,'0')};
  });
  const extent=path.rows.reduce((b,r)=>{
    if(r.distance>finish) return b;
    return {minX:Math.min(b.minX,r.p[0]),maxX:Math.max(b.maxX,r.p[0]),
      minZ:Math.min(b.minZ,r.p[2]),maxZ:Math.max(b.maxZ,r.p[2])};
  },{minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity});
  const first=labels[0];
  return {id,name,description,path,length:finish,gates:labels,extent,markerStep:6.2,oldKey:options.oldKey??null,
    markers:Array.from({length:Math.floor(finish/6.2)+1},(_,i)=>({distance:i*6.2,p:along(path,i*6.2)})),
    plan:coursePlan(path,finish),heading:Math.atan2(first.f[2],first.f[0]),spawn:add(first.p,scale(first.f,-5.2)),
    thresholds:options.thresholds??[.93,1.04,1.22],cityAccess:options.cityAccess??false};
}

function shortcutProjection(path, position) {
  let closest = path.width ** 2, distance = null;
  const rows = path.rows;
  for (let i = 1; i < rows.length; i++) {
    const start = rows[i - 1], end = rows[i];
    const dx = end.p[0] - start.p[0], dz = end.p[2] - start.p[2];
    const x = position[0] - start.p[0], z = position[2] - start.p[2];
    const fraction = clamp((x * dx + z * dz) / (dx * dx + dz * dz), 0, 1);
    const gap = (x - dx * fraction) ** 2 + (z - dz * fraction) ** 2;
    if (gap >= closest) continue;
    closest = gap;
    distance = mix(start.distance, end.distance, fraction);
  }
  return distance === null ? null : {distance, gapSquared:closest};
}

function buildCornerCuts(event) {
  const cuts = event.gates.map(() => []);
  if (event.shortcut) cuts[event.shortcut.nextGate].push(event.shortcut);
  const spacing = event.markerStep * .5;
  for (const bend of event.corners) {
    const first = Math.max(.5, bend.approach - spacing);
    const last = Math.min(event.length - 1, bend.exit.distance + 11);
    for (let from = first; from <= bend.holdUntil - 2; from += spacing) {
      const start = along(event.path, from);
      const gateIndex = event.gates.findIndex(gate => gate.distance > from);
      for (let to = from + 4 * spacing; to <= Math.min(last, from + 40); to += spacing) {
        const end = along(event.path, to);
        const direct = Math.hypot(end[0] - start[0], end[2] - start[2]);
        const saved = to - from - direct;
        if (direct < 4 || saved < Math.min(2.65, (to - from) * .075)) continue;
        const gate = event.gates[gateIndex];
        const crossesCheckpoint = to >= gate.distance;
        if (crossesCheckpoint &&
            (to >= event.gates[gateIndex + 1].distance || crossesGate(gate, start, end) === null)) continue;
        if (!rideableCut(start,end,direct,event.cityAccess)) continue;
        const cut = {from, to, path:travelTable([start, end], 2.4), exitDirection:courseFrame(event.path, to).f};
        cuts[gateIndex].push(cut);
        if (crossesCheckpoint) cuts[gateIndex + 1].push(cut);
      }
    }
  }
  return cuts;
}

function rideableCut(start,end,distance,cityAccess=false) {
  const steps = Math.ceil(distance / .82);
  let totalVerge = 0, consecutiveVerge = 0;
  for (let i = 0; i <= steps; i++) {
    const [x,,z] = lerpPoint(start, end, i / steps);
    if (!safeToRide(x,z,cityAccess)) return false;
    if (surfaceAt(x,z,cityAccess)) consecutiveVerge = 0;
    else {
      totalVerge += distance / steps;
      consecutiveVerge += distance / steps;
      if (consecutiveVerge > 3.4 || totalVerge > Math.min(5, distance * .32)) return false;
    }
  }
  return true;
}

function matchCornerCut(cuts, position, direction, covered, markerStep) {
  let match = null, best = Infinity, merged = covered;
  for (const cut of cuts) {
    if (covered < cut.from - 2 * markerStep || covered > cut.to + 2 * markerStep) continue;
    const projection = shortcutProjection(cut.path, position);
    if (!projection) continue;
    const progress = mix(cut.from, cut.to, projection.distance / cut.path.length);
    if (progress + 2 * markerStep < covered) continue;
    if (cut.path.length - projection.distance < .95 && dot(direction, cut.exitDirection) > .62) {
      merged = Math.max(merged, progress);
    }
    if (projection.gapSquared >= best) continue;
    match = {cut, distance:projection.distance, progress};
    best = projection.gapSquared;
  }
  return {match, merged};
}

const CORNER_SPEED_LIMIT = 10.25;

function brakingCorners(event) {
  const {raw, spacing} = event.plan;
  const zones = [];
  for (let i = 0; i < raw.length; i++) {
    const distance = i * spacing;
    const speed = raw[i];
    if (speed > CORNER_SPEED_LIMIT || distance < 4 || distance > event.length - 3) continue;
    const last = zones.at(-1);
    if (last && distance - last.end <= 10.6) {
      last.end = distance;
      last.speed = Math.min(last.speed, speed);
    } else zones.push({start:distance, end:distance, speed});
  }
  const waypoint = distance => {
    const frame = courseFrame(event.path, distance);
    return {...frame,distance,...timingSpan(frame,event.cityAccess,event.path.width)};
  };
  let previousExit = 0;
  return zones.map((zone, index) => {
    const brakeDistance = clamp((MAX_ROAD_SPEED ** 2 - zone.speed ** 2) / (2 * 4.65), 4, 14);
    const entry = Math.max(previousExit + .45, zone.start - brakeDistance);
    const exit = Math.min(event.length - .8, zone.end + 5.4);
    const approach = Math.max(previousExit, entry - 6.1);
    previousExit = exit;
    return {
      index, approach, entry:waypoint(entry), exit:waypoint(exit), speed:zone.speed,
      holdUntil:zone.end + 2.1,
      station:event.gates.find(gate => gate.distance >= exit).name
    };
  });
}

function referenceCornerScores(event,record,vehicle='bike') {
  const sampleGap=Math.max(300,recordingRules(vehicle).interval*1.75);
  const locate = mark => {
    const i = event.gates.findIndex(gate => gate.distance >= mark.distance);
    const earliest = (record.splits[i - 1] ?? 0) - 350;
    const latest = record.splits[i] + 350;
    const samples = record.samples;
    for (let j = 1; j < samples.length; j++) {
      const a = samples[j - 1], b = samples[j];
      if (b[0] < earliest) continue;
      if (a[0] > latest) break;
      // Recovery jumps must not count as a corner crossing.
      if (b[0] - a[0] > sampleGap || b[6] <= a[6]) continue;
      const fraction = crossesGate(mark, [a[1], a[2], a[3]], [b[1], b[2], b[3]]);
      if (fraction !== null) return {time:mix(a[0], b[0], fraction), speed:mix(a[5], b[5], fraction)};
    }
    return null;
  };
  return event.corners.map(corner => {
    const entry = locate(corner.entry), exit = locate(corner.exit);
    if (!exit) return null;
    return {speed:exit.speed, duration:entry && exit.time > entry.time ? exit.time - entry.time : null};
  });
}

function validCornerScores(scores, count, total) {
  return Array.isArray(scores) && scores.length === count && scores.every(score => score === null ||
    (score && Number.isFinite(score.speed) && score.speed >= 0 && score.speed <= maxBikeSpeed + 1 &&
      (score.duration === null || Number.isFinite(score.duration) && score.duration > 0 && score.duration <= total)));
}

function brakingPaint(event,from=0,to=event.length) {
  const line = new Shape();
  const styles = {
    open:{width:.09, length:1.25, color:'#a6e184'},
    lift:{width:.15, length:.92, color:'#ffd172'},
    brake:{width:.21, length:1.65, color:'#ff8172'}
  };
  for (let d=Math.max(1.6,from); d<Math.min(event.length-1.8,to); d+=2.28) {
    const corner = event.corners.find(c => d >= c.approach && d < c.holdUntil);
    const style = !corner ? styles.open : d < corner.entry.distance ? styles.lift : styles.brake;
    const end = Math.min(event.length - .6, d + style.length);
    const edge = style.width + .035;
    ribbon(line, event.path, -edge, edge, ROAD_Y + .018, '#324736', d, end);
    ribbon(line, event.path, -style.width, style.width, ROAD_Y + .020, style.color, d, end);
  }
  return line;
}

const lawnSpans = [];
let groundSurfaces = null;

function lawnPatch(mesh,draw) {
  const from=mesh.indices.length;
  draw();
  lawnSpans.push({mesh,from,to:mesh.indices.length});
}

function indexGroundSurfaces() {
  const index=new Map();
  const addTriangles=(mesh,from,to,hard)=>{
    const {vertices,indices}=mesh;
    for(let i=from;i<to;i+=3) {
      const a=indices[i]*11, b=indices[i+1]*11, c=indices[i+2]*11;
      if(vertices[a+4]+vertices[b+4]+vertices[c+4]<.6) continue;
      const x=vertices[a], z=vertices[a+2], y=vertices[a+1];
      const bx=vertices[b], bz=vertices[b+2], cx=vertices[c], cz=vertices[c+2];
      const dx=bx-x,dz=bz-z,ex=cx-x,ez=cz-z;
      const det=dx*ez-dz*ex;
      if(Math.abs(det)<.000001) continue;
      const minX=Math.min(x,bx,cx), maxX=Math.max(x,bx,cx), minZ=Math.min(z,bz,cz), maxZ=Math.max(z,bz,cz);
      const triangle={x,z,y,dx,dz,ex,ez,dy:vertices[b+1]-y,ey:vertices[c+1]-y,
        inverse:1/det,minX,maxX,minZ,maxZ,hard};
      for(let col=Math.floor(minX/ROAD_CELL);col<=Math.floor(maxX/ROAD_CELL);col++) {
        for(let row=Math.floor(minZ/ROAD_CELL);row<=Math.floor(maxZ/ROAD_CELL);row++) {
          const key=col*4096+row;
          if(!index.has(key)) index.set(key,[]);
          index.get(key).push(triangle);
        }
      }
    }
  };
  addTriangles(pavement,0,pavement.indices.length,true);
  for(const {mesh,from,to} of lawnSpans) addTriangles(mesh,from,to,false);
  lawnSpans.length=0;
  groundSurfaces=index;
}

function pavedGroundAt(x,z) {
  const triangles=groundSurfaces?.get(streetCell(x,z));
  if(!triangles) return false;
  let top=-Infinity, hard=false;
  for(const face of triangles) {
    if(x<face.minX||x>face.maxX||z<face.minZ||z>face.maxZ) continue;
    const dx=x-face.x, dz=z-face.z;
    const u=(dx*face.ez-dz*face.ex)*face.inverse;
    const v=(face.dx*dz-face.dz*dx)*face.inverse;
    if(u<-.00001||v<-.00001||u+v>1.00001) continue;
    const height=face.y+u*face.dy+v*face.ey;
    if(height>=top-.00001) {top=height;hard=face.hard;}
  }
  return hard;
}

function surfaceAt(x,z,exploring=false) {
  const hit=nearestStreet(x,z);
  return Boolean(hit.street&&hit.distance<=hit.street.width+.21 || pavedGroundAt(x,z) ||
    exploring&&cityStreetAt(x,z));
}

function safeToRide(x,z,exploring=false) {
  const {minX,maxX,minZ,maxZ}=campusBoundary;
  const inside = x>minX+.52 && x<maxX-.52 && z>minZ+.52 && z<maxZ-.52 && inCampus(x,z);
  if (!inside && (!exploring || !cityStreetAt(x,z) || cityBlocked(x,z))) return false;
  return lakeClearance(x,z)>.25 && !buildingAt(x,z)
    && !treeSites.some(tree=>Math.abs(tree.x-x)<.28 && Math.abs(tree.z-z)<.28);
}

function makeCyclist(event,bike=stockBike,vehicle='bike') {
  return {bike,vehicle,position:event.spawn.slice(),heading:event.heading,speed:0,steering:0,travel:0,paved:true,
    energy:1,sprinting:false,sprintLocked:false,throttle:0,brake:0,yawRate:0,lean:0,slip:0,stationaryBrake:0};
}

function moveCyclist(rider,input,dt,exploring=false,recovery=1) {
  const p=rider.position;
  const {paved,vehicle}=rider, cycling=vehicle==='bike';
  const bike=cycling?rider.bike:vehicleChoices[vehicle];
  rider.throttle=mix(rider.throttle,input.gas&&!input.brake?1:0,1-Math.exp(-12.6*dt));
  rider.brake=mix(rider.brake,input.brake?1:0,1-Math.exp(-(input.brake?18.0:24.0)*dt));

  if (!input.sprint) rider.sprintLocked=false;
  rider.sprinting=cycling && paved && !input.brake && input.sprint && !rider.sprintLocked && rider.speed>2.6 && rider.energy>.045;
  if (rider.sprinting) {
    rider.energy=Math.max(0,rider.energy-dt*.193);
    if (rider.energy<=.045) rider.sprintLocked=true;
  } else rider.energy=Math.min(1,rider.energy+dt*recovery*(paved?.052:.035));
  const limit=paved?(rider.sprinting?bike.sprintSpeed:bike.roadSpeed):bike.grassSpeed;
  const drag=(.48+Math.abs(rider.speed)*.047)*(paved?bike.rolling:2.85);

  if (input.brake) {
    if (rider.speed>.03) {
      rider.speed=Math.max(0,rider.speed-(rider.brake*9.3+drag)*dt);
      rider.stationaryBrake=0;
    } else {
      rider.stationaryBrake+=dt;
      if (rider.stationaryBrake>.18) rider.speed=Math.max(-2.18,rider.speed-rider.brake*2.35*dt);
    }
  } else {
    rider.stationaryBrake=0;
    const force=rider.throttle*(rider.sprinting?7.64:paved?5.28:3.40)*bike.force;
    if (rider.speed>limit) rider.speed=Math.max(limit,rider.speed-dt*(paved?3.75:8.85));
    else if (force>drag) rider.speed=Math.min(limit,rider.speed+dt*(force-drag));
    else rider.speed=Math.sign(rider.speed)*Math.max(0,Math.abs(rider.speed)-(drag-force)*dt);
  }

  const forward=rider.speed<-.04?-1:1, velocity=Math.abs(rider.speed);
  const steer=Number(input.right)-Number(input.left);
  const speedFactor = clamp(velocity / 13.2, 0, 1);
  const steeringRate = steer === 0 ? mix(20, 17.5, speedFactor) : mix(14, 10, speedFactor);
  rider.steering = mix(rider.steering, steer, 1 - Math.exp(-steeringRate * dt));
  const low = mix(.55, 1, clamp(velocity / 2.1, 0, 1));
  const wanted = rider.steering * low * mix(1.75, 1.35, speedFactor);
  const grip=(paved?bike.roadGrip:bike.grassGrip)*(1-.145*rider.brake);
  const maxTurn=grip/Math.max(2.75,velocity);
  const load=Math.abs(wanted)/maxTurn;
  rider.slip=mix(rider.slip,clamp((load-.88)*.92,0,1),1-Math.exp(-8.6*dt));
  rider.yawRate=mix(rider.yawRate,clamp(wanted,-maxTurn,maxTurn)*forward,1-Math.exp(-16.1*dt));
  rider.heading+=rider.yawRate*dt;
  rider.heading=Math.atan2(Math.sin(rider.heading),Math.cos(rider.heading));
  if (velocity>4.2 && rider.slip>.04) rider.speed-=forward*rider.slip*2.30*dt;
  const bank=vehicle==='chair'?0:clamp(Math.atan2(Math.max(0,rider.speed)*rider.yawRate,16.1),-.40,.40);
  rider.lean=mix(rider.lean,bank,1-Math.exp(-9.8*dt));

  const step=scale(headingVector(rider.heading-rider.yawRate*dt*.5),rider.speed*dt);
  let x=p[0]+step[0],z=p[2]+step[2];
  const onDeck=exploring?flyoverAt(p[0],p[2]):null;
  const onUpperRoad=onDeck!==null&&p[1]>=onDeck-.34;
  const deckAt=(x,z)=>exploring?flyoverAt(x,z):null;
  const mayRide=(x,z)=>{
    const deck=deckAt(x,z);
    if(onUpperRoad&&onDeck>.40) return deck!==null;
    if(!onUpperRoad&&deck!==null&&deck>.40&&deck<2.78) return false;
    return safeToRide(x,z,exploring);
  };
  if (!mayRide(x,z)) {
    const slideX=mayRide(x,p[2]),slideZ=mayRide(p[0],z);
    if (slideX&&(!slideZ||Math.abs(step[0])>Math.abs(step[2]))) z=p[2];
    else if (slideZ) x=p[0];
    else {x=p[0];z=p[2];}
    rider.speed*=.38;
  }
  rider.paved=surfaceAt(x,z,exploring);
  const deck=deckAt(x,z);
  const height=deck!==null&&(onUpperRoad||deck<=.40) ? deck+.004 : rider.paved?ROAD_Y+.002:-.006;
  rider.position=[x,mix(p[1],height,1-Math.exp(-13*dt)),z];
  rider.travel+=forward*Math.hypot(x-p[0],z-p[2]);
  return p;
}

function crossesGate(gate,previous,next) {
  const a=dot(subtract(previous,gate.p),gate.f),b=dot(subtract(next,gate.p),gate.f);
  if (a>0||b<=0) return null;
  const at=-a/(b-a),hit=lerpPoint(previous,next,at);
  const offset=dot(subtract(hit,gate.p),gate.side);
  return offset>=(gate.minCross??-gate.half)&&offset<=(gate.maxCross??gate.half)?at:null;
}

function packPose(t,r) {
  const q=(x,f)=>Math.round(x*f)/f;
  return [q(t,1000),q(r.position[0],1000),q(r.position[1],1000),q(r.position[2],1000),
    q(r.heading,10000),q(r.speed,1000),q(r.travel,1000),q(r.steering,1000)];
}

function replayAt(record,time) {
  if(!record || time<0 || time>record.time+1400) return null;
  const points=record.samples,t=clamp(time,0,record.time);
  let lo=0,hi=points.length-1;
  while(hi-lo>1) {
    const mid=(lo+hi)>>1;
    if(points[mid][0]<=t) lo=mid;
    else hi=mid;
  }
  const a=points[lo],b=points[hi];
  const f=clamp((t-a[0])/Math.max(.00001,b[0]-a[0]),0,1);
  const jump=Math.hypot(a[1]-b[1],a[3]-b[3])>18;
  const q=jump?(f<1?0:1):f;
  const angle=Math.atan2(Math.sin(b[4]-a[4]),Math.cos(b[4]-a[4]));
  return {position:[mix(a[1],b[1],q),mix(a[2],b[2],q),mix(a[3],b[3],q)],
    heading:a[4]+angle*q,speed:mix(a[5],b[5],q),travel:mix(a[6],b[6],q),steering:mix(a[7],b[7],q)};
}

function makeBenchmark(event,vehicle='bike') {
  const samples=[],splits=[],dt=.034,path=event.path;
  const tuning=vehicleChoices[vehicle], cycling=vehicle==='bike';
  const top=cycling?11.55:tuning.roadSpeed*.96;
  const acceleration=cycling?4.86:4.34*tuning.force;
  const interval=recordingRules(vehicle).interval;
  let distance=-5.2,speed=0,time=0,last=0,gateIndex=0;
  const pose=(at,velocity,t)=>{
    const f=courseFrame(path,Math.max(0,at));
    const p=at<0?add(event.gates[0].p,scale(event.gates[0].f,at)):f.p;
    const next=courseFrame(path,Math.max(0,at)+5).f;
    const turn=Math.atan2(cross(f.f,next)[1],dot(f.f,next));
    return packPose(t,{
      position:add(p,scale(f.side,.92)),heading:Math.atan2(f.f[2],f.f[0]),speed:velocity,
      travel:at+5.2,steering:clamp(-turn*2.2,-.86,.86)
    });
  };
  samples.push(pose(distance,speed,0));
  while(distance<event.length) {
    const pace=Math.min(top,plannedSpeed(event,distance+1.2)*.96+.22);
    speed+=clamp(pace-speed,-6.85*dt,acceleration*dt);
    const next=distance+speed*dt;
    while(event.gates[gateIndex]&&event.gates[gateIndex].distance<=next) {
      const f=clamp((event.gates[gateIndex].distance-distance)/Math.max(.00001,next-distance),0,1);
      splits.push(time+f*dt*1000);gateIndex++;
    }
    distance=next;time+=dt*1000;
    if(time-last>=interval&&distance<event.length) {
      samples.push(pose(distance,speed,time));last=time;
    }
  }
  time=splits.at(-1);
  samples.push(pose(event.length,0,time));
  return {time,splits,samples,kind:'基准影子'};
}

function readRecord(event,key,vehicle='bike') {
  try {
    const raw=localStorage.getItem(key);
    if(!raw||raw.length>2200000) return null;
    const r=JSON.parse(raw);
    if(!r||!Number.isFinite(r.time)||r.time<=4000||r.time>recordingRules(vehicle).limit||
      !Array.isArray(r.splits)||r.splits.length!==event.gates.length ||
      !r.splits.every((v,i)=>Number.isFinite(v)&&v>=0&&v<=r.time&&(i===0||v>r.splits[i-1]))||
      !Array.isArray(r.samples)||r.samples.length<2||r.samples.length>8200||
      !r.samples.every((a,i)=>Array.isArray(a)&&a.length===8&&a.every(Number.isFinite)&&a[0]>=0&&a[0]<=r.time+1&&(i===0||a[0]>r.samples[i-1][0]))) return null;
    const corners = validCornerScores(r.corners, event.corners.length, r.time)
      ? r.corners : referenceCornerScores(event,r,vehicle);
    return {...r, corners, kind:'个人最佳影子'};
  } catch {return null;}
}

function loadBest(event,vehicle='bike') {
  return readRecord(event,recordKey(event,vehicle),vehicle)??
    (vehicle==='bike'&&event.oldKey?readRecord(event,event.oldKey):null);
}

function splitLabel(delta) {
  return Math.abs(delta)<23?'与影子持平':(delta<0?'领先 ':'落后 ')+(Math.abs(delta)/1000).toFixed(2)+' 秒';
}

const motorBenchmarks=new WeakMap();

function recordingRules(vehicle) {
  return {limit:vehicleChoices[vehicle].recordLimit??MAX_RUN_MS,
    interval:vehicleChoices[vehicle].recordInterval??SAMPLE_MS};
}

function vehicleBenchmark(event,vehicle) {
  if(vehicle==='bike') return {run:event.benchmark,medals:event.medalTimes};
  let cache=motorBenchmarks.get(event);
  if(!cache) {cache=new Map();motorBenchmarks.set(event,cache);}
  if(!cache.has(vehicle)) {
    const run=makeBenchmark(event,vehicle);
    run.corners=referenceCornerScores(event,run,vehicle);
    const medals=Object.fromEntries(['gold','silver','bronze'].map((name,i)=>
      [name,Math.round(run.time*[.985,1.12,1.30][i]/10)*10]));
    cache.set(vehicle,{run,medals});
  }
  return cache.get(vehicle);
}

for(const event of courses) {
  event.corners = brakingCorners(event);
  event.benchmark = makeBenchmark(event);
  event.benchmark.corners = referenceCornerScores(event, event.benchmark);
  event.medalTimes=Object.fromEntries(['gold','silver','bronze'].map((m,i)=>[m,Math.round(event.benchmark.time*event.thresholds[i]/10)*10]));
}

function medalName(event,ms,vehicle='bike') {
  const {medals}=vehicleBenchmark(event,vehicle);
  if(ms<=medals.gold) return '金牌';
  if(ms<=medals.silver) return '银牌';
  if(ms<=medals.bronze) return '铜牌';
  return '';
}

const PHYSICS_STEP = 1 / 120;
const STEP_MS = PHYSICS_STEP * 1000;
const COUNTDOWN_TICKS = 360;

class TimeTrial {
  constructor(event,bike=stockBike,vehicle='bike') {
    this.bike=bike;
    this.vehicle=knownVehicle(vehicle);
    this.sessionRecords = new Map();
    this.select(event);
  }

  select(event) {
    this.event = event;
    this.abandon();
  }

  get entryVehicle() { return vehicleChoices[this.vehicle].race?this.vehicle:'bike'; }

  setVehicle(vehicle) {
    if(this.phase==='race'||this.phase==='count'||!Object.hasOwn(vehicleChoices,vehicle)) return false;
    if(this.vehicle!==vehicle) {
      this.vehicle=vehicle;
      this.freeRide();
    }
    return true;
  }

  get ghost() { return this.phase === 'race' ? replayAt(this.reference, this.elapsed) : null; }

  get lastGap() {
    const i = this.splits.length - 1;
    return i < 0 ? null : this.splits[i] - this.reference.splits[i];
  }

  get progressEstimate() {
    if (this.cornerCut) return Math.min(this.cornerCut.progress,this.event.gates[this.nextGate].distance);
    if (this.publicProgress!==null) return this.publicProgress;
    const marks = this.event.markers;
    const a = marks[Math.max(0, this.routeMark - 1)], b = marks[this.routeMark] ?? a;
    const span = subtract(b.p, a.p);
    const t = clamp(dot(subtract(this.rider.position, a.p), span) / Math.max(.001, dot(span, span)), 0, 1);
    return mix(a.distance, b.distance, t);
  }

  setBike(bike) {
    if (this.phase === 'race' || this.phase === 'count') return false;
    this.bike = this.rider.bike = bike;
    return true;
  }

  sector(index,from=index-1,name=index===0?'起步':this.event.gates[index]?.name) {
    const end = this.splits[index];
    if (end === undefined) return null;
    const duration = end - (this.splits[from] ?? 0);
    const target = this.reference.splits[index] - (this.reference.splits[from] ?? 0);
    return {duration,delta:duration-target,name};
  }

  stageSector(stage) {
    return this.sector(stage.finishGate,stage.index?stage.startGate:-1,stage.name);
  }

  start() {
    this.event.cuts??=buildCornerCuts(this.event);
    if(this.event.cityAccess&&!this.event.markers[0].publicRoads) notePublicMarkers(this.event);
    this.freeRide();
    this.rider=makeCyclist(this.event,this.bike,this.entryVehicle);
    this.phase = 'count';
    this.countdownTicks = COUNTDOWN_TICKS;
    this.countdown = this.countdownTicks * PHYSICS_STEP;
    this.frames = [packPose(0, this.rider)];
    this.nextRecording=this.recordRules.interval;
  }

  freeRide() {
    if(this.rider.vehicle!==this.vehicle) {
      const {position,heading,paved}=this.rider;
      this.rider={...makeCyclist(this.event,this.bike,this.vehicle),position,heading,paved};
    }
    const entry=this.entryVehicle;
    const key=recordKey(this.event,entry);
    const {run,medals}=vehicleBenchmark(this.event,entry);
    this.recordRules=recordingRules(entry);
    this.bestRun=this.sessionRecords.get(key)??loadBest(this.event,entry);
    this.best=this.bestRun?.time??null;
    this.medalTimes=medals;
    this.phase = 'free';
    this.elapsed = 0;
    this.nextGate = 0;
    this.routeMark = 0;
    this.cornerCut = this.publicProgress = null;
    this.countdown = this.countdownTicks = this.accumulator = 0;
    this.paused = this.record = this.offRoute = false;
    this.splits = [];
    this.frames = [];
    this.lastRejoin = -Infinity;
    this.reference=this.bestRun??run;
    this.cornerIndex = 0;
    this.cornerEntryAt = null;
    this.lastCorner = null;
    this.cornerScores = new Array(this.event.corners.length).fill(null);
  }

  abandon() {
    this.rider=makeCyclist(this.event,this.bike,this.vehicle);
    this.moved = false;
    this.freeRide();
  }

  markCourse() {
    const {markers, markerStep, cuts} = this.event, p = this.rider.position;
    const gap = marker => Math.hypot(marker.p[0] - p[0], marker.p[2] - p[2]);
    while (markers[this.routeMark] && gap(markers[this.routeMark]) < 5.72) this.routeMark++;
    const covered = markers[this.routeMark - 1]?.distance ?? 0;
    const direction=headingVector(this.rider.heading),gate=this.event.gates[this.nextGate];
    const {match,merged}=matchCornerCut(cuts[this.nextGate],p,direction,covered,markerStep);
    this.cornerCut=match;
    this.publicProgress=this.event.cityAccess?projectPublicCourse(this.event,p,direction,covered,gate):null;
    const distance=Math.min(gate.distance,Math.max(merged,this.publicProgress??0));
    if(distance>covered) this.routeMark=Math.max(this.routeMark,Math.floor(distance/markerStep)+1);
    this.offRoute=Boolean(!this.cornerCut&&this.publicProgress===null&&this.nextGate>0&&
      markers[this.routeMark]&&gap(markers[this.routeMark])>13);
  }

  rejoin() {
    if (this.phase !== 'race' || this.paused) return false;
    const gate = this.event.gates[this.nextGate];
    const covered = this.routeMark ? this.event.markers[this.routeMark - 1].distance : 0;
    const at = Math.max(0, Math.min(covered - 3.1, gate.distance - 6.1));
    const frame = courseFrame(this.event.path, at);
    const ride=makeCyclist(this.event,this.bike,this.rider.vehicle);
    if (this.nextGate > 0) {
      ride.position = frame.p;
      ride.heading = Math.atan2(frame.f[2], frame.f[0]);
    }
    ride.energy = this.rider.energy;
    ride.travel = this.rider.travel;
    const departure = packPose(this.elapsed, this.rider);
    if (this.frames.at(-1)?.[0] === departure[0]) this.frames[this.frames.length - 1] = departure;
    else this.frames.push(departure);
    this.rider = ride;
    this.elapsed += REJOIN_MS;
    this.lastRejoin = this.elapsed;
    this.frames.push(packPose(this.elapsed, ride));
    this.nextRecording=this.elapsed+this.recordRules.interval;
    this.routeMark = Math.min(this.routeMark, Math.max(0, Math.ceil(at / this.event.markerStep)));
    this.cornerCut = this.publicProgress = null;
    this.cornerEntryAt = null;
    this.lastCorner = null;
    this.offRoute = false;
    return true;
  }

  measureCorner(previous, approachingSpeed, covered) {
    if (this.offRoute || this.nextGate === 0) return;
    const {corners, markerStep} = this.event;
    let corner = corners[this.cornerIndex];
    while (corner && covered > corner.exit.distance + markerStep) {
      this.cornerEntryAt = null;
      corner = corners[++this.cornerIndex];
    }
    if (!corner || covered < corner.entry.distance - markerStep) return;
    const next = this.rider.position;
    const entered = crossesGate(corner.entry, previous, next);
    if (entered !== null) this.cornerEntryAt = this.elapsed + entered * STEP_MS;
    if (covered < corner.exit.distance - markerStep) return;
    const exited = crossesGate(corner.exit, previous, next);
    if (exited === null) return;
    const at = this.elapsed + exited * STEP_MS;
    const score = {
      speed:Math.max(0, mix(approachingSpeed, this.rider.speed, exited)),
      duration:this.cornerEntryAt === null ? null : at - this.cornerEntryAt
    };
    this.cornerScores[corner.index] = score;
    this.lastCorner = {...score, at, index:corner.index};
    this.cornerIndex++;
    this.cornerEntryAt = null;
  }

  finishAt(time) {
    this.elapsed = time;
    this.phase = 'done';
    this.cornerCut = this.publicProgress = null;
    this.rider.speed = 0;
    this.record = (this.best === null || time < this.best) &&time<=this.recordRules.limit;
    if (!this.record) return;
    if (this.frames.at(-1)?.[0] >= time - .001) this.frames.pop();
    this.frames.push(packPose(time, this.rider));
    this.best = time;
    this.bestRun = {
      time, splits:this.splits.slice(), samples:this.frames.slice(), corners:this.cornerScores.slice(), kind:'个人最佳影子'
    };
    const key=recordKey(this.event,this.rider.vehicle);
    this.sessionRecords.set(key,this.bestRun);
    try { localStorage.setItem(key,JSON.stringify(this.bestRun)); } catch {}
  }

  step(input) {
    if (this.phase === 'count') {
      this.countdown = --this.countdownTicks * PHYSICS_STEP;
      if (this.countdownTicks === 0) this.phase = 'race';
      return;
    }
    const speedBefore = this.rider.speed;
    const racing=this.phase==='race';
    const previous=moveCyclist(this.rider,input,PHYSICS_STEP,this.phase==='free'||this.event.cityAccess,
      racing ? this.event.sprintRecovery : 1);
    this.moved ||= Math.hypot(previous[0] - this.rider.position[0], previous[2] - this.rider.position[2]) > .0001;
    if (this.phase !== 'race') return;
    this.markCourse();
    const event = this.event, gate = event.gates[this.nextGate];
    const covered = this.routeMark ? event.markers[this.routeMark - 1].distance : 0;
    this.measureCorner(previous, speedBefore, covered);
    const crossed = crossesGate(gate, previous, this.rider.position);
    const reachable=Math.max(covered,this.cornerCut?.progress??0,this.publicProgress??0);
    if (crossed !== null && reachable >= gate.distance - event.markerStep - .015) {
      const split = this.elapsed + crossed * STEP_MS;
      this.splits.push(split);
      this.nextGate++;
      if (this.nextGate === event.gates.length) {
        this.finishAt(split);
        return;
      }
    }
    this.elapsed += STEP_MS;
    if(this.elapsed>=this.nextRecording&&this.elapsed<=this.recordRules.limit) {
      this.frames.push(packPose(this.elapsed,this.rider));
      this.nextRecording=this.elapsed+this.recordRules.interval;
    }
  }

  advance(dt, input) {
    if (this.paused || this.phase === 'done' || !(dt > 0)) return;
    const carried = this.accumulator;
    const available = carried + dt;
    const ticks = Math.floor((available + 1e-9) / PHYSICS_STEP);
    this.accumulator = Math.max(0, available - ticks * PHYSICS_STEP);
    const sample = typeof input === 'function' ? input : () => input;
    // Each tick samples input at its fixed boundary, independent of render frames.
    for (let tick = 1; tick <= ticks && this.phase !== 'done'; tick++) {
      this.step(sample(tick * PHYSICS_STEP - carried));
    }
  }
}


const mapCache = new WeakMap();
const mapExtent = {minX:-232,maxX:366,minZ:-269,maxZ:287};

function mapPath(ctx, project, points, close = false) {
  ctx.beginPath();
  points.forEach((p, index) => {
    const [x,y] = project(p);
    if (index) ctx.lineTo(x,y);
    else ctx.moveTo(x,y);
  });
  if (close) ctx.closePath();
}

function drawCourseMap(ctx,project,compact,event) {
  const solid=event.path.rows.filter(r=>r.distance<event.length).map(r=>r.p);
  solid.push(event.gates.at(-1).p);
  mapPath(ctx,project,solid);
  ctx.strokeStyle = compact ? '#162c23b8' : '#39563c';
  ctx.lineWidth = compact ? 3.70 : 6.45;
  ctx.stroke();
  ctx.lineWidth = compact ? 1.55 : 2.98;
  if(event.stages) {
    for(const stage of event.stages) {
      const points=[along(event.path,stage.from),...event.path.rows
        .filter(row=>row.distance>stage.from&&row.distance<stage.to).map(row=>row.p),along(event.path,stage.to)];
      mapPath(ctx,project,points);
      ctx.strokeStyle=stage.color;
      ctx.stroke();
    }
  } else {
    ctx.strokeStyle = compact ? '#d6e697' : '#edeeac';
    ctx.stroke();
  }
  if (!compact && event.shortcut) {
    ctx.save();
    mapPath(ctx, project, event.shortcut.path.rows.map(row => row.p));
    ctx.setLineDash([3.4, 2.5]);
    ctx.strokeStyle = '#8c683a';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.restore();
  }
  if (!compact) {
    for (let d = 13; d < event.length-7; d += event.stages?79:33) {
      const p = courseFrame(event.path,d);
      const [x,y] = project(p.p);
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(Math.atan2(p.f[2],p.f[0]));
      ctx.beginPath();
      ctx.moveTo(-3,-3); ctx.lineTo(2,0); ctx.lineTo(-3,3);
      ctx.strokeStyle = '#2a4e39';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }
}

function campusChart(width,height,dpr,compact,event,focus,exploring,cityView) {
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(width * dpr));
  canvas.height = Math.max(1, Math.round(height * dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const pad = compact ? 7 : 21;
  const bounds = cityView ? cityExtent : focus ? {
    minX:event.extent.minX-37,maxX:event.extent.maxX+37,
    minZ:event.extent.minZ-41,maxZ:event.extent.maxZ+41
  } : !exploring&&event.cityAccess ? {
    minX:Math.min(mapExtent.minX,event.extent.minX-22),maxX:Math.max(mapExtent.maxX,event.extent.maxX+22),
    minZ:Math.min(mapExtent.minZ,event.extent.minZ-22),maxZ:Math.max(mapExtent.maxZ,event.extent.maxZ+22)
  } : mapExtent;
  const w=bounds.maxX-bounds.minX,h=bounds.maxZ-bounds.minZ;
  const fit = Math.max(.02, Math.min((width - pad * 2) / w, (height - pad * 2) / h));
  const left = (width - w * fit) * .5, top = (height - h * fit) * .5;
  const project=p=>[left+(p[0]-bounds.minX)*fit,top+(p[2]-bounds.minZ)*fit];
  const unproject=(x,y)=>[bounds.minX+(x-left)/fit,bounds.minZ+(y-top)/fit];
  const campusColor = compact ? '#344442' : '#c0c6b7';
  ctx.fillStyle = campusColor;
  ctx.fillRect(0,0,width,height);
  ctx.lineWidth = 1;
  ctx.strokeStyle = compact ? '#b7ceaf1c' : '#79886630';
  const step = (compact ? 23 : 10) * fit;
  for (let x = left; x < width; x += step) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,height); ctx.stroke();
  }
  for (let y = top; y < height; y += step) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke();
  }
  const {minX,maxX,minZ,maxZ}=campusBoundary;
  for(const outline of campusOutlines) {
    mapPath(ctx,project,outline.map(([x,z])=>[x,0,z]),true);
    ctx.fillStyle=compact?'#395747':'#adbf94';
    ctx.fill();
    ctx.strokeStyle=compact?'#89ab8a79':'#728767';
    ctx.lineWidth=compact?1.2:2.15;
    ctx.stroke();
  }
  ctx.lineJoin=ctx.lineCap='round';
  for(const path of cityRoads.keys()) {
    mapPath(ctx,project,path.rows.map(r=>r.p));
    ctx.strokeStyle=compact?'#83918d':'#7c9291';
    ctx.lineWidth=Math.max(2,path.width*2*fit);ctx.stroke();
    ctx.strokeStyle=compact?'#b7bfaa45':'#c3cabc';
    ctx.lineWidth=compact?.58:1.25;ctx.stroke();
  }
  for (const tree of treeSites) {
    if (tree.x < minX+1 || tree.x > maxX-1 || tree.z < minZ+1 || tree.z > maxZ-1) continue;
    const [x,y] = project([tree.x,0,tree.z]);
    ctx.beginPath(); ctx.arc(x,y,Math.max(1,tree.r*fit*.79),0,TAU);
    ctx.fillStyle = compact ? '#82a67835' : ['#7d9c6b99','#92a4739e','#8da47b95'][tree.color];
    ctx.fill();
  }
  for (const basin of basins) {
    mapPath(ctx,project,Array.from({length:92},(_,i)=>bank(basin,TAU*i/92)),true);
    ctx.fillStyle=compact?'#427369':'#61928c';ctx.fill();
    ctx.strokeStyle=compact?'#82a798ad':'#e0e7c9';ctx.lineWidth=compact?.75:1.45;ctx.stroke();
  }

  ctx.lineJoin = ctx.lineCap = 'round';
  for (const street of roads) {
    mapPath(ctx,project,street.rows.map(item => item.p));
    ctx.strokeStyle = compact ? '#a6b99979' : laneColors.get(street) ?? '#e8dfc0';
    ctx.lineWidth = Math.max(1.2, (2 * street.width + 1.1) * fit);
    ctx.stroke();
  }
  const oval = (width,length,y) => Array.from({length:50},(_,i)=>
    ovalPoint(athleticsField,(i<25?0:-Math.PI)+.00001+(Math.PI-.00002)*(i%25)/24,width,length,y));
  mapPath(ctx,project,oval(athleticsField.w,athleticsField.depth,0),true);
  ctx.fillStyle=compact?'#a77963':'#b67656';ctx.fill();
  mapPath(ctx,project,oval(athleticsField.w-5.8,athleticsField.depth-5.8,0),true);
  ctx.fillStyle=compact?'#52694e':'#95aa75';ctx.fill();
  if (!exploring || focus) drawCourseMap(ctx,project,compact,event);

  const labelBuildings=width>=294&&height>=229;
  const labels=[];
  const fontSize = Math.min(13, Math.max(10, fit * 4.8));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const block of campus) {
    ctx.fillStyle = compact ? '#b5c0a973' : (block.palette === clay ? '#ac8068' : '#879589');
    ctx.strokeStyle = compact ? '#d9e2c32d' : '#fff1cc9e';
    ctx.lineWidth=.85;
    for(const foot of block.parts??[block]) {
      mapPath(ctx,project,footprintCorners(foot),true);
      ctx.fill();ctx.stroke();
    }
    const wing = block.kind==='huiwen' || block.kind==='huizi';
    if(!compact&&labelBuildings&&block.name&&(!wing||focus||fit>1.42||block.priority>=10)) {
      const [x,y]=project([block.x,0,block.z]);
      const name=wing?(focus||fit>1.42 ?
        (block.kind==='huiwen'?'H'+block.wing:block.wing+' 座') :
        (block.kind==='huiwen'?'汇文楼':'汇紫楼')):block.name;
      labels.push({block,x,y,name});
    }
  }
  labels.sort((a,b)=>(b.block.priority??0)-(a.block.priority??0));
  const printed=[];
  ctx.font='600 '+fontSize.toFixed(1)+'px "Microsoft YaHei","PingFang SC",sans-serif';
  for(const {name,x,y} of labels) {
    const w=ctx.measureText(name).width+6;
    if(x-w*.5<4||x+w*.5>width-3||y<14||y>height-17||
      printed.some(p=>Math.abs(p.x-x)<(p.w+w)/2&&Math.abs(p.y-y)<fontSize+3)) continue;
    printed.push({x,y,w});
    ctx.lineWidth=3;ctx.strokeStyle='#eef0cae8';ctx.fillStyle='#2a4136';
    ctx.strokeText(name,x,y);ctx.fillText(name,x,y);
  }
  ctx.fillStyle=compact?'#dfeadb':'#fff6da';
  ctx.font='600 '+(compact?8:11)+'px "Microsoft YaHei","PingFang SC",sans-serif';
  if (compact) {
    const [x,y]=project([-67,0,135]);
    ctx.fillText('文山湖',x,y);
  } else {
    for(const b of basins.slice(0,2)) {
      const [x,y]=project([b.x,0,b.z]);ctx.fillText(b.name,x,y);
    }
  }
  if(!compact) {
    ctx.font='500 10px "Microsoft YaHei",sans-serif';
    const labels=[
      ...courts.filter(c=>['校友广场','时光广场','天人广场'].includes(c.name)).map(c=>[c.name,...c.xy]),
      ['田径运动场',athleticsField.x,athleticsField.z],
      ...(focus||fit>1.42?[['汇文楼组团',-41,-185],['汇紫楼',54,29]]:[]),
      ...campusLanes.map(lane=>[lane.name,...lane.at])
    ];
    for(const [name,x,z] of labels) {
      const [ax,ay]=project([x,0,z]);
      ctx.fillStyle='#3a5946';ctx.strokeStyle='#dfe8c7';ctx.lineWidth=3;
      ctx.strokeText(name,ax,ay);ctx.fillText(name,ax,ay);
    }
  }
  if(!compact) {
    ctx.font='700 '+(width<400?10:11)+'px "Microsoft YaHei","PingFang SC",sans-serif';
    for(const gate of [...campusGates,...canghaiGates]) {
      const [x,y]=project([gate.xy[0],0,gate.xy[1]]);
      ctx.beginPath();ctx.arc(x,y,2.9,0,TAU);
      ctx.fillStyle='#d8b16b';ctx.fill();
      ctx.strokeStyle='#485a4e';ctx.lineWidth=1.35;ctx.stroke();
      ctx.fillStyle='#334b3d';ctx.strokeStyle='#e3e9cb';ctx.lineWidth=2.8;
      const yOff=gate.name==='立德门'?9:-9;
      ctx.strokeText(gate.name,x,y+yOff);ctx.fillText(gate.name,x,y+yOff);
    }
    for(const [name,x,z] of [['南海大道',-142,25],['深南大道',-11,-244],['白石路',157,177],['粤海南区',297,256],['深大站',metroStop[0]-8,metroStop[1]-9]]) {
      const [px,py]=project([x,0,z]);
      ctx.fillStyle='#304b41';ctx.strokeStyle='#e5e9cd';ctx.lineWidth=2.8;
      ctx.strokeText(name,px,py);ctx.fillText(name,px,py);
    }
    const x = width - 21, y = 28;
    ctx.fillStyle = '#324f3e'; ctx.strokeStyle = '#f1efca';
    ctx.beginPath(); ctx.moveTo(x,y - 9); ctx.lineTo(x - 4,y + 3); ctx.lineTo(x + 4,y + 3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.font = '600 12px "Microsoft YaHei",sans-serif';
    ctx.fillText('北',x,y + 12);
    const ruler=fit>1.62?20:50,span=ruler*fit,by=height-15;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#2e4838';
    ctx.fillRect(15,by,span,1.8);
    ctx.fillRect(15,by - 3,1.2,4.8);
    ctx.fillRect(15 + span,by - 3,1.2,4.8);
    ctx.font = '600 11px "Microsoft YaHei",sans-serif';
    ctx.fillText(ruler+' 游戏米',20 + span,by - 1);
  }
  return {width,height,dpr,canvas,project,unproject,event,focus,exploring,cityView};
}

function mapPin(ctx, project, rider, compact, ghost=false) {
  const [x,y] = project(rider.position);
  const r = compact ? 4.2 : 7.2;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rider.heading + Math.PI / 2);
  ctx.beginPath();
  ctx.moveTo(0,-r*1.48); ctx.lineTo(r*.83,r*.83); ctx.lineTo(0,r*.41); ctx.lineTo(-r*.83,r*.83); ctx.closePath();
  ctx.fillStyle = ghost?'#91dadc':'#f2ad6a';
  ctx.strokeStyle = ghost?'#214b50':'#46372c';
  ctx.lineWidth = compact ? 1.15 : 1.8;
  ctx.fill(); ctx.stroke();
  ctx.restore();
  if (!compact && !ghost) {
    ctx.font = '700 13px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#253f34';
    ctx.fillStyle = '#fff6da';
    ctx.strokeText(driverProfile.name,x+10,y+1);
    ctx.fillText(driverProfile.name,x+10,y+1);
  }
}

function renderCampusMap(element,race,compact,focused=false) {
  const width = element.clientWidth, height = element.clientHeight;
  if (!width || !height) return;
  const dpr=Math.min(2,devicePixelRatio||1),event=race.event;
  const exploring = race.phase === 'free';
  const cityView = exploring && (compact ? !inCampus(race.rider.position[0],race.rider.position[2]) : !focused);
  let layout = mapCache.get(element);
  if (!layout || layout.width !== width || layout.height !== height || layout.dpr !== dpr || layout.event!==event ||
      layout.focus!==focused || layout.exploring!==exploring || layout.cityView!==cityView) {
    layout=campusChart(width,height,dpr,compact,event,focused,exploring,cityView);
    element.width = layout.canvas.width;
    element.height = layout.canvas.height;
    mapCache.set(element,layout);
  }
  const ctx = element.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(layout.canvas,0,0);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  for(const gate of exploring && !focused ? [] : event.gates) {
    const [x,y] = layout.project(gate.p);
    const active = race.phase !== 'free' && race.phase !== 'done' && race.nextGate === gate.index;
    const passed = race.phase !== 'free' && race.nextGate > gate.index;
    const terminal = gate.index === 0 || gate.index===event.gates.length-1;
    const r = compact ? (active ? 3.5 : 2.65) : (active ? 9 : 7);
    ctx.beginPath();
    ctx.arc(x,y,r,0,TAU);
    ctx.fillStyle = active ? '#eaf5a1' : passed ? '#6b8b58' : terminal ? '#f2d291' : '#405e49';
    ctx.strokeStyle = compact ? '#b3cbab' : '#eff2d1';
    ctx.lineWidth = active ? 1.75 : 1.3;
    ctx.fill(); ctx.stroke();
    if (!compact) {
      ctx.font = '700 9px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = active || terminal ? '#294535' : '#f1f4d9';
      ctx.fillText(terminal ? gate.number[0] : String(gate.index),x,y+.2);
    }
  }
  const shadow=preferences.ghost?race.ghost:null;
  if(shadow) mapPin(ctx,layout.project,shadow,compact,true);
  if(race.offRoute&&event.markers[race.routeMark]) {
    const r=event.markers[race.routeMark].p, [x,y]=layout.project(r);
    ctx.beginPath();ctx.arc(x,y,compact?3:6,0,TAU);ctx.strokeStyle='#f6b067';ctx.lineWidth=2;ctx.stroke();
  }
  mapPin(ctx,layout.project,race.rider,compact);
}


function timeLabel(ms) {
  const centiseconds = Math.max(0,Math.floor(ms/10 + 1e-8));
  const part = (n) => String(n).padStart(2,'0');
  return part(Math.floor(centiseconds/6000)) + ':' + part(Math.floor(centiseconds/100) % 60) + '.' + part(centiseconds % 100);
}

const drive = new Set(), touches = new Map();

const driveChanges = [];
let appliedDrive = neutralDrive;
const driveCodes = new Map([
  ['KeyW','gas'],['ArrowUp','gas'],['KeyS','brake'],['ArrowDown','brake'],
  ['KeyA','left'],['ArrowLeft','left'],['KeyD','right'],['ArrowRight','right'],['ShiftLeft','sprint'],['ShiftRight','sprint']
]);

function setText(element,text) {
  if (element.textContent !== text) element.textContent = text;
}

function updateDrive() {
  const acts = new Set([...touches.values(),...Array.from(drive,code=>driveCodes.get(code))]);
  return {gas:acts.has('gas')||acts.has('sprint'),brake:acts.has('brake'),left:acts.has('left'),right:acts.has('right'),sprint:acts.has('sprint')};
}

function queueDrive(event) {
  const now = performance.now();
  const stamp = event.timeStamp > 0 && event.timeStamp <= now + 1 ? event.timeStamp : now;
  const time = Math.max(driveChanges.at(-1)?.time ?? 0, stamp);
  driveChanges.push({time, input:updateDrive()});
}

function driveAt(time) {
  while (driveChanges[0]?.time <= time + .0001) appliedDrive = driveChanges.shift().input;
  return appliedDrive;
}

function clearInput() {
  drive.clear();
  touches.clear();
  driveChanges.length = 0;
  appliedDrive = neutralDrive;
  for (const button of touchButtons) button.classList.remove('active');
}
